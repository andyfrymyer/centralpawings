if(page==='team')main.innerHTML=`<span class="eyebrow">Central PA Wings · 16U Girls</span><h1>The Wings roster.</h1>${[['7','Ella Morgan','Guard'],['12','Jordan Reed','Forward'],['3','Avery Brooks','Guard'],['24','Maya Turner','Center']].map(([n,name,role])=>`<button class="row" data-player="${name}"><span class="number">${n}</span><span class="grow"><h3>${name}</h3><p class="muted">${role} · #${n}</p></span>›</button>`).join('')}<section><h2>Team essentials</h2><button class="row" data-action="attendance"><span class="grow"><h3>Next-game attendance</h3><p class="muted">8 confirmed · 2 pending</p></span>›</button></section>`;
if(typeof lucide!=='undefined')lucide.createIcons();main.innerHTML+='<div class="caption">Design preview · Sample players & events<br><button class="replay" data-action="replay">Replay opening screen</button></div>';}
document.getElementById('enter').onclick=finishIntro;document.getElementById('close').onclick=()=>modal.close();modal.addEventListener('close',()=>body.querySelectorAll('video').forEach(v=>v.pause()));document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){main.querySelectorAll('video').forEach(v=>v.pause());page=b.dataset.page;render();main.scrollTop=0;return}if(b.dataset.day){day=b.dataset.day;render();return}if(b.dataset.player){open(b.dataset.player,'<p>Sample player · Central PA Wings</p><h3>Development focus</h3><p>Footwork, balance, and finishing through contact.</p>');return}const a=b.dataset.action;if(a==='replay')replay();if(a==='account')open('Coach workspace','<p>Central PA Wings · Coach preview</p><p>Sample data only. No messages, purchases, or live team updates occur here.</p>');if(a==='game'||a==='game2')open(a==='game'?'Wings vs. Keystone':'Wings vs. Liberty',`<p>Saturday, May 15 · Pool play</p><h2>${a==='game'?'10:30 AM · Court 4':'2:00 PM · Court 2'}</h2><p>Arrive ${a==='game'?'9:45 AM':'1:15 PM'}. Bring both uniforms, water, and warm-up gear.</p><button class="primary" data-action="venue">Venue details</button>`);if(a==='court')open('Court 4. Same tip-off.','<p>The first game moved from Court 2 to Court 4. Arrive at 9:45 AM.</p><button class="primary" data-action="ack">Got it — Court 4</button>');if(a==='ack'){ack=true;modal.close();render()}if(a==='venue')open('Venue & arrival','<p>Atlantic City Convention Center<br>1 Convention Boulevard<br>Atlantic City, NJ</p><p>Sample event: confirm the actual venue before traveling.</p>');if(a==='attendance')open('Game attendance','<h2>8 confirmed · 2 pending</h2><p>Ella Morgan — pending<br>Jordan Reed — pending</p><p>Sample attendance. No reminders are sent from this preview.</p>');if(a==='upload')open('Add game film','<p>Choose local footage. Nothing is uploaded.</p><label for="film-file">Video file</label><input type="file" id="film-file" accept="video/*"><p id="error" class="error" role="alert"></p>')});
document.addEventListener('change',e=>{if(e.target.id!=='film-file')return;const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('video/')){document.getElementById('error').textContent='Choose a video file.';return}if(video)URL.revokeObjectURL(video);video=URL.createObjectURL(f);videoName=f.name;modal.close();page='film';render()});render();introTimer=setTimeout(finishIntro,2200);
</script></body></html>
